services:
  postgres:
    image: postgres:16
    container_name: transcript_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transcript_db}
      POSTGRES_USER: ${POSTGRES_USER:-transcript_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcript_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transcript_user} -d ${POSTGRES_DB:-transcript_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: transcript_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: transcript_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.app
    container_name: transcript_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://transcript_user:transcript_pass@postgres:5432/transcript_db}
      JOBS_ROOT: ${JOBS_ROOT:-/data/jobs}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
      OBJECT_STORAGE_ENABLED: ${OBJECT_STORAGE_ENABLED:-true}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio12345}
      S3_BUCKET: ${S3_BUCKET:-transcripts}
      S3_SECURE: ${S3_SECURE:-false}
    ports:
      - "${API_PORT_PUBLIC:-8000}:8000"
    volumes:
      - jobs_data:/data/jobs
      - api_state:/var/lib/fbtranscribe
    command: ["fbtranscribe-api"]

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.app
    container_name: transcript_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://transcript_user:transcript_pass@postgres:5432/transcript_db}
      JOBS_ROOT: ${JOBS_ROOT:-/data/jobs}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
      OBJECT_STORAGE_ENABLED: ${OBJECT_STORAGE_ENABLED:-true}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio12345}
      S3_BUCKET: ${S3_BUCKET:-transcripts}
      S3_SECURE: ${S3_SECURE:-false}
    volumes:
      - jobs_data:/data/jobs
      - worker_state:/var/lib/fbtranscribe
      - huggingface_cache:/root/.cache/huggingface
      - faster_whisper_cache:/root/.cache/faster-whisper
    command: ["fbtranscribe-worker"]

  ollama:
    image: ollama/ollama:latest
    container_name: transcript_ollama
    restart: unless-stopped
    profiles: ["ai"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  minio_data:
  redis_data:
  jobs_data:
  api_state:
  worker_state:
  huggingface_cache:
  faster_whisper_cache:
  ollama_data:
